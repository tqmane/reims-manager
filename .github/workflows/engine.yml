name: Windows engine package
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified engine as a release
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        id: msys
        with:
          msystem: UCRT64
          update: true
          install: >-
            make diffutils bison flex
            mingw-w64-ucrt-x86_64-clang mingw-w64-ucrt-x86_64-llvm
            mingw-w64-ucrt-x86_64-llvm-tools mingw-w64-ucrt-x86_64-lld
            mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-glib2 mingw-w64-ucrt-x86_64-pixman
            mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-libslirp
            mingw-w64-ucrt-x86_64-libusb mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-vulkan-headers mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-vulkan-validation-layers mingw-w64-ucrt-x86_64-spirv-tools
      - name: Build pinned Reims QEMU and package its native dependencies
        shell: pwsh
        env:
          REIMS_BUILD_MSYS: ${{ steps.msys.outputs.msys2-location }}
        run: ./tools/build-engine.ps1 -MsysRoot $env:REIMS_BUILD_MSYS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ReimsEngine-win-x64
          path: artifacts/engine/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download the successful build artifact and publish without replacing assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name ReimsEngine-win-x64 --dir engine-release
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed.' }
          $pin=Get-Content backend/engine-lock.json -Raw | ConvertFrom-Json
          $assets=@(Get-ChildItem engine-release -File | ForEach-Object FullName)
          gh release create $pin.id @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Reims Windows engine $($pin.id)" --notes-file docs/engine-release.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; existing releases are never overwritten.' }
