name: Metal toolchain probe
on:
  pull_request:
    paths:
      - .github/workflows/metal-toolchain-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: xcode-27
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: tqmane/metal2vulkan
          ref: 46b6abd9b81dd0edf164b9029428cdc4d2d07fca
          path: runtime
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /crates/metal2vulkan-validation/fixtures/public/engine/a27_a3_early_return_barrier.air.ll
            /crates/metal2vulkan-validation/fixtures/public/engine/a27_memory_order.metal
      - name: Record CPU-only diagnostics (not qualification)
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import signal
          import subprocess
          import tempfile
          import time

          output = Path(os.environ["RUNNER_TEMP"]) / "metal-toolchain-probe"
          output.mkdir()
          fixture_dir = Path("runtime/crates/metal2vulkan-validation/fixtures/public/engine").resolve()
          typed = fixture_dir / "a27_a3_early_return_barrier.air.ll"
          msl = fixture_dir / "a27_memory_order.metal"
          report = {
              "diagnostic_only": True,
              "qualification": "not performed",
              "runtime_revision": "46b6abd9b81dd0edf164b9029428cdc4d2d07fca",
              "selected_developer_dir": os.environ.get("DEVELOPER_DIR"),
              "inherited_deployment_target": os.environ.get("MACOSX_DEPLOYMENT_TARGET"),
              "inputs": [
                  {"name": path.name,
                   "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                   "header": path.read_text().splitlines()[:lines]}
                  for path, lines in [(typed, 6), (msl, 2)]
              ],
              "records": [],
          }
          deadline = time.monotonic() + 210

          def record(item):
              report["records"].append(item)
              (output / "report.json").write_text(json.dumps(report, indent=2) + "\n")
              with (output / "report.txt").open("a") as log:
                  log.write(json.dumps(item, indent=2) + "\n")
              print(json.dumps(item), flush=True)

          def run(label, args, environment, target=None):
              item = {
                  "label": label, "command": [str(arg) for arg in args],
                  "developer_dir": environment.get("DEVELOPER_DIR"),
                  "deployment_target": target, "exit_code": None,
                  "stdout": "", "stderr": "",
              }
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  record({**item, "status": "not_run", "reason": "210-second diagnostic budget exhausted"})
                  return False
              env = dict(environment)
              if target is not None:
                  env["MACOSX_DEPLOYMENT_TARGET"] = target
              started = time.monotonic()
              try:
                  process = subprocess.Popen(
                      item["command"], env=env, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                      encoding="utf-8", errors="replace", start_new_session=True,
                  )
              except OSError as error:
                  record({**item, "status": "unavailable", "stderr": str(error)})
                  return False
              try:
                  stdout, stderr = process.communicate(timeout=min(15, remaining))
                  status = "completed"
              except subprocess.TimeoutExpired:
                  try:
                      os.killpg(process.pid, signal.SIGKILL)
                  except ProcessLookupError:
                      pass
                  stdout, stderr = process.communicate()
                  status = "timed_out"
              item.update(
                  status=status, exit_code=process.returncode, stdout=stdout, stderr=stderr,
                  elapsed_ms=round((time.monotonic() - started) * 1000),
              )
              record(item)
              return status == "completed" and process.returncode == 0

          selected = dict(os.environ)
          clt = Path("/Library/Developer/CommandLineTools")
          developers = [("selected", selected)]
          if clt.is_dir():
              developers.append(("command-line-tools", {**selected, "DEVELOPER_DIR": str(clt)}))
          else:
              record({"label": "command-line-tools", "status": "unavailable", "exit_code": None,
                      "stderr": "CommandLineTools directory is absent"})

          with tempfile.TemporaryDirectory(prefix="metal-probe-", dir=os.environ["RUNNER_TEMP"]) as scratch:
              work = Path(scratch)
              for name, env in developers:
                  run(name + "/selection", ["xcode-select", "-p"], env)
                  run(name + "/xcode-version", ["xcodebuild", "-version"], env)
                  for tool in ["metal", "metal-as", "metallib"]:
                      run(name + "/find-" + tool, ["xcrun", "--sdk", "macosx", "--find", tool], env)
                  run(name + "/metal-version", ["xcrun", "--sdk", "macosx", "metal", "--version"], env)
                  run(name + "/sdk-version", ["xcrun", "--sdk", "macosx", "--show-sdk-version"], env)
                  air = work / (name + ".air")
                  assembled = run(name + "/assemble-typed", [
                      "xcrun", "--sdk", "macosx", "metal-as", typed, "-o", air,
                  ], env, "26.0")
                  for target in ["26.0", "27.0"]:
                      if assembled:
                          run(name + "/package-typed/" + target, [
                              "xcrun", "--sdk", "macosx", "metallib", air, "-o",
                              work / (name + "-" + target + ".metallib"),
                          ], env, target)
                      else:
                          record({"label": name + "/package-typed/" + target, "status": "not_run",
                                  "exit_code": None, "reason": "typed assembly did not succeed"})
                      run(name + "/compile-msl/" + target, [
                          "xcrun", "--sdk", "macosx", "metal", "-c", "-std=metal4.1",
                          "-mmacosx-version-min=" + target, msl, "-o",
                          work / (name + "-msl-" + target + ".air"),
                      ], env, target)
          print("Diagnostic collection finished; no fixture or GPU qualification was performed.")
          PY
      - name: Upload diagnostic text only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: metal-toolchain-probe
          path: |
            ${{ runner.temp }}/metal-toolchain-probe/report.json
            ${{ runner.temp }}/metal-toolchain-probe/report.txt
          if-no-files-found: warn
          retention-days: 7
