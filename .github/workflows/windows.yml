name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manager:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      - name: Fetch pinned runtime archives
        shell: pwsh
        run: ./tools/fetch-runtimes.ps1
      - name: Check engine installation and dependency closure fixtures
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./backend/tests/engine-package.ps1
          if ($LASTEXITCODE) { throw 'Engine fixtures failed.' }
          pwsh -NoProfile -File ./backend/tests/native-probe.ps1
          if ($LASTEXITCODE) { throw 'Native timeout fixture failed.' }
          python ./tools/test_package_engine.py
          if ($LASTEXITCODE) { throw 'DLL closure fixtures failed.' }
          python ./backend/tests/opencore-patches.py
          if ($LASTEXITCODE) { throw 'OpenCore patch fixtures failed.' }
          python ./backend/tests/guest-bridge.py
          if ($LASTEXITCODE) { throw 'Guest bridge fixtures failed.' }
      - name: Build manager and run native self-checks
        shell: pwsh
        run: ./tools/build.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ReimsManager-win-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
